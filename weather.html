<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sivlin's Weather Dashboard</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .weather-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            color: white;
            transition: transform 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .weather-card:hover {
            transform: translateY(-5px);
        }
        
        .city-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 8px;
        }
        
        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .temp {
            font-size: 3rem;
            font-weight: bold;
        }
        
        .weather-icon {
            font-size: 3rem;
        }
        
        .weather-detail {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .update-time {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            margin-top: 20px;
        }
        
        .news-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .news-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .news-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .news-item:hover {
            background: rgba(255, 255, 255, 0.05);
            padding-left: 8px;
        }
        
        .news-headline {
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .news-source {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .refresh-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        
        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .temp {
                font-size: 2rem;
            }
            
            body {
                padding: 10px;
            }
        }
    </style>
    <script>
        // Save weather data locally when online
        function saveToCache(data) {
            localStorage.setItem('cachedWeather', JSON.stringify(data));
            localStorage.setItem('lastUpdate', new Date().toISOString());
        }

        // Load from cache when offline
        function loadFromCache() {
            const cached = localStorage.getItem('cachedWeather');
            if (cached) {
                return JSON.parse(cached);
            }
            return null;
        }

        // Modified loadWeather with offline fallback
        async function loadWeather() {
            const grid = document.getElementById('weatherGrid');
            grid.innerHTML = '<div class="loading">Loading weather...</div>';
            
            try {
                // Try online first
                const weatherPromises = cities.map(city => 
                    fetchWeather(city.lat, city.lon).then(data => ({ city, data }))
                );
                
                const results = await Promise.all(weatherPromises);
                
                // Save to cache
                saveToCache(results);
                displayWeather(results);
                
            } catch (error) {
                console.log('Offline mode - using cached data');
                const cached = loadFromCache();
                
                if (cached) {
                    displayWeather(cached);
                    showOfflineNotice();
                } else {
                    grid.innerHTML = '<div class="loading">⚠️ No internet and no cached data. Connect to internet first.</div>';
                }
            }
        }

        function showOfflineNotice() {
            const notice = document.createElement('div');
            notice.style.position = 'fixed';
            notice.style.bottom = '10px';
            notice.style.left = '10px';
            notice.style.right = '10px';
            notice.style.background = '#ff9800';
            notice.style.color = 'black';
            notice.style.padding = '8px';
            notice.style.borderRadius = '8px';
            notice.style.textAlign = 'center';
            notice.style.fontSize = '12px';
            notice.innerHTML = '⚠️ Offline mode - showing last saved weather';
            document.body.appendChild(notice);
            setTimeout(() => notice.remove(), 3000);
        }
        </script>
</head>
<body>
    <div class="container">
        <h1>
            <span>🌍</span>
            Sivlin's Weather Dashboard
        </h1>

        <div class="grid" id="weatherGrid">
            <div class="loading">Loading weather data...</div>
        </div>

        <div class="news-section">
            <div class="news-title">
                <span>📰</span>
                Weather News & Updates
            </div>
            <div id="newsList">
                <div class="loading">Loading news...</div>
            </div>

            <button class="refresh-btn" onclick="refreshAll()">⟳ Refresh All</button>
        </div>

        <div class="update-time" id="updateTime"></div>
    </div>

    <script>
        //Cities to track
        const cities = [
            { name: "Siem Reap, Cambodia", lat: 11.5564, lon: 104.9282 },
            { name: "Phnom Penh, Cambodia", lat: 13.3622, lon: 103.8596 },
            { name: "New York, USA", lat: 40.7128, lon: -74.0060 },
            { name: "Beijing, China", lat: 39.9042, lon: 116.4074 },
            { name: "Sydney, Australia", lat: -33.8688, lon: 151.2093 },
        ];

        //Weather icons mapping
        function getWeatherIcon(code) {
            const icons = {
                0: "☀️",   // Clear
                1: "⛅",    // Partly cloudy
                2: "☁️",    // Cloudy
                3: "🌧️",    // Rain
                45: "🌫️",   // Fog
                61: "🌧️",   // Rain
                71: "❄️",    // Snow
                95: "⛈️"     // Thunderstorm
            };
            return icons[code] || "🌍";
        }

        //Fetch weather from api
        async function fetchWeather(lat, lon) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,relative_humidity_2m&timezone=auto`;
            const response = await fetch(url);
            const data = await response.json();
            return data;
        }

        // Get weather description
        function getWeatherDescription(code) {
            const descriptions = {
                0: "Clear sky",
                1: "Partly cloudy",
                2: "Cloudy",
                3: "Overcast",
                45: "Foggy",
                61: "Rainy",
                71: "Snow",
                95: "Thunderstorm"
            };
            return descriptions[code] || "Variable";
        }

        // Load all weather data 
        async function loadWeather() {
            const grid = document.getElementById('weatherGrid');
            grid.innerHTML = '<div class="loading">Loading weather data...</div>';
            
            try {
                const weatherPromises = cities.map(city => 
                    fetchWeather(city.lat, city.lon).then(data => ({ city, data }))
                );
                
                const results = await Promise.all(weatherPromises);
                
                grid.innerHTML = '';

                results.forEach(({ city, data }) => {
                    const weather = data.current_weather;
                    const temp = weather.temperature;
                    const wind = weather.windspeed;
                    const code = weather.weathercode;
                    const icon = getWeatherIcon(code);
                    const description = getWeatherDescription(code);
                    
                    // Get humidity from hourly data (first hour)
                    const humidity = data.hourly?.relative_humidity_2m?.[0] || '--';

                    const card = document.createElement('div');
                    card.className = 'weather-card';
                    card.innerHTML = `
                        <div class="city-name">${city.name}</div>
                        <div class="weather-main">
                            <div class="temp">${Math.round(temp)}°C</div>
                            <div class="weather-icon">${icon}</div>
                        </div>
                        <div>${description}</div>
                        <div class="weather-detail">
                            <span>💨 Wind: ${Math.round(wind)} km/h</span>
                            <span>💧 Humidity: ${humidity}%</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = '<div class="loading">⚠️ Error loading weather. Check internet connection.</div>';
                console.error('Weather error:', error);
            }
        }

        // Fetch weather news from RSS feeds (using free RSS to JSON proxy)
        async function loadNews() {
            const newsDiv = document.getElementById('newsList');
            newsDiv.innerHTML = '<div class="loading">Loading news...</div>';
            
            // Free news sources (no API key needed)
            const newsSources = [
                { name: "BBC Weather", url: "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml" },
                { name: "Weather Channel", url: "https://rss.weather.com/weather/rss/weather" }
            ];

            try {
                // Using RSS2JSON free proxy (no key required)
                const proxy = "https://api.rss2json.com/v1/api.json?rss_url=";
                const response = await fetch(proxy + encodeURIComponent(newsSources[0].url));
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    newsDiv.innerHTML = '';
                    // Show top 8 news items
                    data.items.slice(0, 8).forEach(item => {
                        const newsItem = document.createElement('div');
                        newsItem.className = 'news-item';
                        newsItem.onclick = () => window.open(item.link, '_blank');
                        newsItem.innerHTML = `
                            <div class="news-headline">${item.title}</div>
                            <div class="news-source">${item.author || 'Weather News'} • ${new Date(item.pubDate).toLocaleDateString()}</div>
                        `;
                        newsDiv.appendChild(newsItem);
                    });
                } else {
                    newsDiv.innerHTML = '<div class="loading">📡 Weather updates loading...</div>';
                }
            } catch (error) {
                newsDiv.innerHTML = '<div class="loading">📰 News feed temporarily unavailable</div>';
                console.error('News error:', error);
            }
        }

        // Update timestamp
        function updateTimestamp() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            document.getElementById('updateTime').innerHTML = `🔄 Last updated: ${timeStr} • Auto-refreshes every 30 minutes`;
        }
        
        // Refresh everything
        async function refreshAll() {
            updateTimestamp();
            await Promise.all([loadWeather(), loadNews()]);
        }

        // Auto-refresh every 30 minutes
        setInterval(refreshAll, 30 * 60 * 1000);
        
        // Initial load
        refreshAll();
        
        // Add to home screen instruction (for mobile)
        if (window.matchMedia('(display-mode: browser)').matches && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            setTimeout(() => {
                const toast = document.createElement('div');
                toast.style.position = 'fixed';
                toast.style.bottom = '20px';
                toast.style.left = '20px';
                toast.style.right = '20px';
                toast.style.background = 'rgba(0,0,0,0.8)';
                toast.style.color = 'white';
                toast.style.padding = '12px';
                toast.style.borderRadius = '12px';
                toast.style.textAlign = 'center';
                toast.style.fontSize = '14px';
                toast.style.zIndex = '1000';
                toast.innerHTML = '📱 Add to Home Screen for app-like experience • Tap Share → Add to Home Screen';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 5000);
            }, 2000);
        }
    </script>
</body>
</html>
