<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#16213e">
    <meta name="description" content="Sivlin's Weather Dashboard - Weather information for cities around the world">

    <link rel="manifest" href="manifest.json">

    <title>Sivlin's Weather Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
                'Open Sans', 'Helvetica Neue', sans-serif;

            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(300px, 1fr)
            );

            gap: 20px;
            margin-bottom: 30px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);

            border-radius: 20px;
            padding: 20px;
            color: white;

            transition: transform 0.3s;

            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .weather-card:hover {
            transform: translateY(-5px);
        }

        .city-name {
            font-size: 1.5rem;
            font-weight: bold;

            margin-bottom: 15px;

            border-bottom: 2px solid rgba(255, 255, 255, 0.3);

            padding-bottom: 8px;
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .temp {
            font-size: 3rem;
            font-weight: bold;
        }

        .weather-icon {
            font-size: 3rem;
        }

        .weather-detail {
            display: flex;
            justify-content: space-between;

            margin-top: 10px;
            padding-top: 10px;

            border-top: 1px solid rgba(255, 255, 255, 0.2);

            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .update-time {
            text-align: center;

            color: rgba(255, 255, 255, 0.6);

            font-size: 0.8rem;
            margin-top: 20px;
        }

        .news-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);

            border-radius: 20px;

            padding: 20px;

            color: white;

            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .news-title {
            font-size: 1.3rem;
            font-weight: bold;

            margin-bottom: 15px;

            display: flex;
            align-items: center;

            gap: 10px;
        }

        .news-item {
            padding: 12px 0;

            border-bottom: 1px solid rgba(255, 255, 255, 0.1);

            cursor: pointer;

            transition: background 0.2s;
        }

        .news-item:hover {
            background: rgba(255, 255, 255, 0.05);

            padding-left: 8px;
        }

        .news-headline {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .news-source {
            font-size: 0.7rem;

            color: rgba(255, 255, 255, 0.6);
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.2);

            border: none;

            color: white;

            padding: 8px 16px;

            border-radius: 20px;

            cursor: pointer;

            margin-top: 15px;

            font-size: 0.9rem;

            transition: background 0.3s;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .loading {
            text-align: center;

            padding: 20px;

            color: rgba(255, 255, 255, 0.7);
        }

        .offline-notice {
            position: fixed;

            bottom: 10px;
            left: 10px;
            right: 10px;

            background: #ff9800;

            color: black;

            padding: 10px;

            border-radius: 8px;

            text-align: center;

            font-size: 12px;

            z-index: 1000;
        }

        .install-btn {
            display: none;

            margin: 0 auto 20px;

            background: rgba(255, 255, 255, 0.2);

            border: 1px solid rgba(255, 255, 255, 0.3);

            color: white;

            padding: 10px 20px;

            border-radius: 20px;

            cursor: pointer;

            font-size: 0.9rem;
        }

        .install-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .temp {
                font-size: 2rem;
            }

            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            <span>🌍</span>
            Sivlin's Weather Dashboard
        </h1>

        <button
            id="installBtn"
            class="install-btn"
            onclick="installPWA()"
        >
            📱 Install Weather App
        </button>

        <div
            class="grid"
            id="weatherGrid"
        >
            <div class="loading">
                Loading weather data...
            </div>
        </div>

        <div class="news-section">

            <div class="news-title">
                <span>📰</span>
                Weather News & Updates
            </div>

            <div id="newsList">

                <div class="loading">
                    Loading news...
                </div>

            </div>

            <button
                class="refresh-btn"
                onclick="refreshAll()"
            >
                ⟳ Refresh All
            </button>

        </div>

        <div
            class="update-time"
            id="updateTime"
        ></div>

    </div>

<script>

    /* =========================================
       CITIES
    ========================================= */

    const cities = [

        {
            name: "Siem Reap, Cambodia",
            lat: 13.3671,
            lon: 103.8448
        },

        {
            name: "Phnom Penh, Cambodia",
            lat: 11.5564,
            lon: 104.9282
        },

        {
            name: "New York, USA",
            lat: 40.7128,
            lon: -74.0060
        },

        {
            name: "Beijing, China",
            lat: 39.9042,
            lon: 116.4074
        },

        {
            name: "Sydney, Australia",
            lat: -33.8688,
            lon: 151.2093
        }

    ];


    /* =========================================
       WEATHER ICON
    ========================================= */

    function getWeatherIcon(code) {

        const icons = {

            0: "☀️",

            1: "🌤️",

            2: "⛅",

            3: "☁️",

            45: "🌫️",

            48: "🌫️",

            51: "🌦️",

            53: "🌦️",

            55: "🌧️",

            61: "🌧️",

            63: "🌧️",

            65: "🌧️",

            71: "❄️",

            73: "❄️",

            75: "❄️",

            80: "🌦️",

            81: "🌧️",

            82: "🌧️",

            95: "⛈️",

            96: "⛈️",

            99: "⛈️"

        };

        return icons[code] || "🌍";
    }


    /* =========================================
       WEATHER DESCRIPTION
    ========================================= */

    function getWeatherDescription(code) {

        const descriptions = {

            0: "Clear sky",

            1: "Mainly clear",

            2: "Partly cloudy",

            3: "Overcast",

            45: "Foggy",

            48: "Depositing rime fog",

            51: "Light drizzle",

            53: "Moderate drizzle",

            55: "Dense drizzle",

            61: "Slight rain",

            63: "Moderate rain",

            65: "Heavy rain",

            71: "Slight snow",

            73: "Moderate snow",

            75: "Heavy snow",

            80: "Slight rain showers",

            81: "Moderate rain showers",

            82: "Violent rain showers",

            95: "Thunderstorm",

            96: "Thunderstorm with hail",

            99: "Thunderstorm with heavy hail"

        };

        return descriptions[code] || "Variable";
    }


    /* =========================================
       FETCH WEATHER
    ========================================= */

    async function fetchWeather(lat, lon) {

        const url =
            `https://api.open-meteo.com/v1/forecast` +
            `?latitude=${lat}` +
            `&longitude=${lon}` +
            `&current_weather=true` +
            `&hourly=temperature_2m,relative_humidity_2m` +
            `&timezone=auto`;

        const response = await fetch(url);

        if (!response.ok) {

            throw new Error(
                `Weather API error: ${response.status}`
            );
        }

        return await response.json();
    }


    /* =========================================
       CACHE WEATHER
    ========================================= */

    function saveToCache(data) {

        try {

            localStorage.setItem(
                "cachedWeather",
                JSON.stringify(data)
            );

            localStorage.setItem(
                "lastWeatherUpdate",
                new Date().toISOString()
            );

        } catch (error) {

            console.error(
                "Unable to save cache:",
                error
            );
        }
    }


    function loadFromCache() {

        try {

            const cached =
                localStorage.getItem(
                    "cachedWeather"
                );

            if (cached) {

                return JSON.parse(cached);

            }

        } catch (error) {

            console.error(
                "Unable to load cache:",
                error
            );
        }

        return null;
    }


    /* =========================================
       DISPLAY OFFLINE MESSAGE
    ========================================= */

    function showOfflineNotice() {

        const oldNotice =
            document.querySelector(
                ".offline-notice"
            );

        if (oldNotice) {
            oldNotice.remove();
        }

        const notice =
            document.createElement("div");

        notice.className =
            "offline-notice";

        notice.innerHTML =
            "⚠️ Offline mode — showing the last saved weather data";

        document.body.appendChild(notice);

        setTimeout(() => {

            notice.remove();

        }, 5000);
    }


    /* =========================================
       DISPLAY WEATHER
    ========================================= */

    function displayWeather(results) {

        const grid =
            document.getElementById(
                "weatherGrid"
            );

        grid.innerHTML = "";

        results.forEach(
            ({ city, data }) => {

                const weather =
                    data.current_weather;

                if (!weather) {
                    return;
                }

                const temp =
                    weather.temperature;

                const wind =
                    weather.windspeed;

                const code =
                    weather.weathercode;

                const icon =
                    getWeatherIcon(code);

                const description =
                    getWeatherDescription(code);

                const humidity =
                    data.hourly
                    ?.relative_humidity_2m
                    ?.[0] ?? "--";


                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "weather-card";


                card.innerHTML = `

                    <div class="city-name">
                        ${city.name}
                    </div>

                    <div class="weather-main">

                        <div class="temp">
                            ${Math.round(temp)}°C
                        </div>

                        <div class="weather-icon">
                            ${icon}
                        </div>

                    </div>

                    <div>
                        ${description}
                    </div>

                    <div class="weather-detail">

                        <span>
                            💨 Wind:
                            ${Math.round(wind)}
                            km/h
                        </span>

                        <span>
                            💧 Humidity:
                            ${humidity}%
                        </span>

                    </div>
                `;

                grid.appendChild(card);
            }
        );

    }


    /* =========================================
       LOAD WEATHER
    ========================================= */

    async function loadWeather() {

        const grid =
            document.getElementById(
                "weatherGrid"
            );

        grid.innerHTML =
            '<div class="loading">Loading weather data...</div>';


        try {

            const weatherPromises =
                cities.map(
                    async city => {

                        const data =
                            await fetchWeather(
                                city.lat,
                                city.lon
                            );

                        return {
                            city,
                            data
                        };

                    }
                );


            const results =
                await Promise.all(
                    weatherPromises
                );


            saveToCache(results);

            displayWeather(results);

            updateTimestamp();

        } catch (error) {

            console.error(
                "Weather error:",
                error
            );


            const cached =
                loadFromCache();


            if (cached) {

                displayWeather(
                    cached
                );

                showOfflineNotice();

                updateTimestamp(
                    true
                );

            } else {

                grid.innerHTML = `

                    <div class="loading">

                        ⚠️ Unable to load weather.

                        <br><br>

                        Please check your internet
                        connection and try again.

                    </div>
                `;
            }
        }

    }


    /* =========================================
       WEATHER NEWS
    ========================================= */

    async function loadNews() {

        const newsDiv =
            document.getElementById(
                "newsList"
            );

        newsDiv.innerHTML =
            '<div class="loading">Loading news...</div>';


        const newsSource =
            "https://feeds.bbci.co.uk/news/" +
            "science_and_environment/rss.xml";


        try {

            const proxy =
                "https://api.rss2json.com/v1/api.json?rss_url=";


            const response =
                await fetch(
                    proxy +
                    encodeURIComponent(
                        newsSource
                    )
                );


            if (!response.ok) {

                throw new Error(
                    "News API error"
                );
            }


            const data =
                await response.json();


            if (
                data.items &&
                data.items.length > 0
            ) {

                newsDiv.innerHTML = "";


                data.items
                    .slice(0, 8)
                    .forEach(item => {

                        const newsItem =
                            document.createElement(
                                "div"
                            );

                        newsItem.className =
                            "news-item";


                        newsItem.onclick =
                            () => {

                                window.open(
                                    item.link,
                                    "_blank",
                                    "noopener,noreferrer"
                                );

                            };


                        const date =
                            item.pubDate
                            ? new Date(
                                item.pubDate
                              ).toLocaleDateString()
                            : "";


                        newsItem.innerHTML = `

                            <div class="news-headline">
                                ${item.title}
                            </div>

                            <div class="news-source">
                                ${item.author || "Weather News"}
                                ${date ? " • " + date : ""}
                            </div>

                        `;


                        newsDiv.appendChild(
                            newsItem
                        );

                    });


            } else {

                newsDiv.innerHTML =
                    '<div class="loading">📡 Weather updates unavailable.</div>';

            }

        } catch (error) {

            console.error(
                "News error:",
                error
            );

            newsDiv.innerHTML =
                '<div class="loading">📰 News feed temporarily unavailable.</div>';
        }

    }


    /* =========================================
       TIMESTAMP
    ========================================= */

    function updateTimestamp(
        offline = false
    ) {

        const now =
            new Date();


        const timeStr =
            now.toLocaleTimeString();


        const updateTime =
            document.getElementById(
                "updateTime"
            );


        updateTime.innerHTML = offline

            ? `⚠️ Showing cached data • ${timeStr}`

            : `🔄 Last updated: ${timeStr} • Auto-refreshes every 30 minutes`;

    }


    /* =========================================
       REFRESH EVERYTHING
    ========================================= */

    async function refreshAll() {

        await Promise.all([
            loadWeather(),
            loadNews()
        ]);

    }


    /* =========================================
       AUTO REFRESH
    ========================================= */

    setInterval(
        refreshAll,
        30 * 60 * 1000
    );


    /* =========================================
       SERVICE WORKER
    ========================================= */

    if (
        "serviceWorker"
        in navigator
    ) {

        window.addEventListener(
            "load",
            () => {

                navigator.serviceWorker
                    .register("sw.js")
                    .then(
                        registration => {

                            console.log(
                                "Service Worker registered:",
                                registration.scope
                            );

                        }
                    )
                    .catch(
                        error => {

                            console.error(
                                "Service Worker registration failed:",
                                error
                            );

                        }
                    );

            }
        );

    }


    /* =========================================
       PWA INSTALL
    ========================================= */

    let deferredPrompt = null;


    window.addEventListener(
        "beforeinstallprompt",
        event => {

            event.preventDefault();

            deferredPrompt =
                event;


            const installBtn =
                document.getElementById(
                    "installBtn"
                );


            installBtn.style.display =
                "block";

        }
    );


    async function installPWA() {

        if (!deferredPrompt) {

            alert(
                "Your browser does not currently provide an install option."
            );

            return;
        }


        deferredPrompt.prompt();


        const result =
            await deferredPrompt.userChoice;


        console.log(
            "Install result:",
            result.outcome
        );


        deferredPrompt =
            null;


        document.getElementById(
            "installBtn"
        ).style.display =
            "none";

    }


    window.addEventListener(
        "appinstalled",
        () => {

            console.log(
                "Weather PWA installed."
            );

        }
    );


    /* =========================================
       ONLINE / OFFLINE DETECTION
    ========================================= */

    window.addEventListener(
        "offline",
        () => {

            showOfflineNotice();

        }
    );


    /* =========================================
       START APP
    ========================================= */

    refreshAll();

</script>

</body>
</html>
